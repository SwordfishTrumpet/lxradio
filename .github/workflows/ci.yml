name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded push must not keep burning runners: one run per ref at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. State it here so the token scope does not
# depend on a repository setting nobody reviews (#36).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest tests/ --cov=lxradio --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.xml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Build package
        run: uv build
      - name: Install from wheel
        # Explicit venv: newer uv refuses `uv pip install` without an active
        # environment, which silently broke this gate for weeks (issue #21).
        run: |
          uv venv
          uv pip install --python .venv/bin/python dist/*.whl
      - name: Verify import
        # Must use the venv interpreter so we verify the installed wheel,
        # not the runner's system Python.
        run: .venv/bin/python -c "import lxradio; from lxradio.history import History; from lxradio.app import View; assert hasattr(View, 'HISTORY'), 'HISTORY view missing'"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run ruff
        run: uv run ruff check src/ tests/
      - name: Run mypy
        run: uv run mypy src/
